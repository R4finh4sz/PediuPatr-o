# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria}
#spring.main.allow-circular-references=true
app.admin-password=${ADMIN_PASSWORD:}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG

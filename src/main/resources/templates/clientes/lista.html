<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="content">
<h2>Clientes</h2>
<a th:if="${perfil == 'ATENDENTE'}" th:href="@{/clientes/novo}" class="btn btn-primary mb-3">Novo cliente</a>
<table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>Endereço</th><th>Ações</th></tr></thead>
<tbody><tr th:each="cliente : ${clientes}">
<td th:text="${cliente.nome}"></td><td th:text="${cliente.telefone}"></td>
<td><span th:text="${cliente.logradouro}"></span> <span th:text="${cliente.numero}"></span>
<span th:text="${cliente.complemento}"></span> <span th:text="${cliente.bairro}"></span>
<span th:text="${cliente.cidade}"></span> <span th:text="${cliente.estado}"></span>
<span th:if="${cliente.logradouro == null}" th:text="${cliente.endereco}"></span></td>
<td th:if="${perfil == 'ATENDENTE'}">
<a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-outline-primary">Editar</a>
<form th:action="@{/clientes/deletar/{id}(id=${cliente.id})}" method="post" class="d-inline">
<button class="btn btn-outline-danger" onclick="return confirm('Excluir cliente?')">Excluir</button>
</form></td>
</tr></tbody></table>
</div></body></html>
